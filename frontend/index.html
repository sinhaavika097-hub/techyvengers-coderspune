<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Handover</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0f172a' },
                        brand: { 500: '#2563eb', 600: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        /* Glassmorphism for Auth Modal */
        .glass-panel { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-900 text-slate-300 h-screen overflow-hidden flex">
    
    <!-- AUTHENTICATION MODAL (Hidden by default) -->
    <div id="auth-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center glass-panel">
        <div class="bg-slate-800 border border-slate-700 p-8 rounded-xl shadow-2xl w-96 transform transition-all">
            <h2 class="text-xl font-bold text-white mb-2" id="auth-target-name">Secure Handoff</h2>
            <p class="text-sm text-slate-400 mb-6">Enter incoming employee credentials to decrypt handover records.</p>
            
            <div id="auth-error" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/50 rounded text-red-400 text-sm font-semibold">
                Access Denied: Invalid ID or Password.
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Incoming Employee ID</label>
                    <input type="text" id="auth-id" placeholder="e.g. NEW-E1" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Passkey</label>
                    <input type="password" id="auth-pass" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white focus:border-brand-500 focus:outline-none">
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="closeAuthModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-2 rounded font-bold transition-colors">Cancel</button>
                    <button onclick="submitAuth()" class="flex-1 bg-brand-600 hover:bg-brand-500 text-white py-2 rounded font-bold transition-colors shadow-lg shadow-brand-500/30">Decrypt</button>
                </div>
            </div>
        </div>
    </div>

    <!-- LEFT PANEL: Record Access -->
    <aside class="w-80 bg-slate-850 border-r border-slate-700 flex flex-col shrink-0">
        <div class="p-6 border-b border-slate-700 bg-slate-900">
            <h1 class="text-2xl font-extrabold text-white tracking-tight mb-1">RECORD HANDOVER</h1>
            <p class="text-xs text-brand-500 font-bold uppercase tracking-widest mb-4">Enterprise Gateway</p>
            <input type="text" placeholder="Search employee..." class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-brand-500 shadow-inner">
        </div>
        <div id="employee-list" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- JS injects employees here -->
        </div>
    </aside>

    <!-- RIGHT PANEL: Employee Workspace -->
    <main class="flex-1 flex flex-col relative bg-slate-900">
        <div id="welcome-screen" class="flex-1 flex flex-col items-center justify-center text-slate-600">
            <svg class="w-24 h-24 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            <h2 class="text-2xl font-bold">Encrypted Vault</h2>
            <p class="mt-2 text-sm">Select an employee from the left panel and authenticate to view handover records.</p>
        </div>

        <div class="p-8 flex-1 overflow-y-auto hide-scroll hidden" id="workspace-container">
            <!-- JS injects authenticated timeline here -->
        </div>

        <!-- WORKBOOK DRAWER -->
        <div id="workbook-drawer" class="fixed top-0 right-0 w-96 h-full bg-slate-850 border-l border-slate-700 shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col z-40">
            <div class="p-5 border-b border-slate-700 flex justify-between items-center bg-slate-800">
                <h2 id="workbook-title" class="font-bold text-white tracking-wide">WORKBOOK</h2>
                <button id="close-drawer" class="text-slate-400 hover:text-white font-bold text-2xl">×</button>
            </div>
            <div id="workbook-content" class="flex-1 overflow-y-auto p-5 space-y-6">
                <!-- JS injects links here -->
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
